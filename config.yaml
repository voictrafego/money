# Parâmetros do analista de dividendos.
# Defaults seguem o livro (Orleans Martins & Felipe Pontes). Ajuste conforme seu perfil.

universo:
  anos_historico: 10          # janela de análise de fundamentos (livro usa 10; flexível)
  ano_base: 2025              # último exercício com DFP na CVM; empresas sem o ano caem p/ o anterior e são sinalizadas

# --- Cap. 8: filtros de garimpo ---
screening:
  custom:                     # filtros customizados (8.2)
    volume_min_diario: 15_000_000   # R$ 15 milhões/dia
    roe_min: 0.10                   # ROE > 10% em todos os anos
    exigir_pl_positivo: true        # PL não-negativo em todos os anos
    exigir_lucro_todos_anos: true
    exigir_dividendos_todos_anos: true
    dy_corte: "selic"               # DY > Selic ("selic") ou um float fixo (ex.: 0.06)
  graham:                     # filtros de Graham (8.3)
    original:
      faturamento_min_usd: 100_000_000
      faturamento_min_usd_concessionaria: 50_000_000
      liquidez_corrente_min: 2.0
      anos_lucro: 10
      crescimento_lucro_min: 0.3333  # >= 1/3 em 10 anos (médias trienais)
      anos_dividendos: 20
      pl_max: 15.0
      pvpa_max: 1.5
      pl_x_pvpa_max: 22.5
    flexivel_br:                     # versão flexibilizada para o Brasil (livro)
      liquidez_corrente_min: null    # relaxado (permite < 2)
      anos_lucro: 5
      anos_dividendos: 5
      pl_max: 20.0
      pvpa_max: 3.0
  bsd:                        # Big, Safe Dividend de Carlson (8.4)
    anos_media: 3             # médias de 3 anos
    winsor: 0.10              # winsorização a 10% nos extremos
    corte: 80                 # foco em BSD > 80
    pesos:                    # somam 100
      payout: 30
      cobertura_juros: 10
      fc_sobre_lucro: 5
      dividend_yield: 5
      desempenho_relativo_preco: 10
      variacao_tangivel_vp: 10
      crescimento_lucro_lp: 10
      crescimento_fc_3a: 5
      crescimento_dividendos_3a: 10
      crescimento_lucro_3a: 5

# --- FIX-04: normalização de lucro (base canônica do valuation) ---
# Janela N + winsorização que produzem a base de lucro robusta a UM exercício atípico,
# consumida por ROE/LPA/CAGR/payout de valuation (roe_valuation/lpa_valuation).
# Knob SEPARADO do bloco `bsd` de propósito: `bsd` parametriza o SCORE de garimpo
# (Cap. 8, elegibilidade per-ano); este parametriza o VALUATION (Cap. 13-17). Mantê-los
# desacoplados evita que afinar o screening mexa, sem querer, no número intrínseco.
normalizacao:
  anos_media: 3             # médias trienais (espírito BSD Cap. 8.4)
  winsor: 0.10              # winsorização a 10% nos extremos (>=5 pontos)

# --- Cap. 16/17: CAPM (custo de capital do acionista) ---
capm:
  abordagem: "local"          # FIX-03: CAPM local (Cap. 17.2) com Selic ao vivo do BCB (rf)
                              # + ERP Brasil fixo + beta. "eua_ajustada" (literais 2019) segue
                              # disponível como fallback de método (legado do caso Itaú).
  # --- abordagem "local" (default, FIX-03 — Ke coerente com o custo de capital de hoje) ---
  erp_local: 0.06             # ERP Brasil aplicado SOBRE a Selic: ~4,5% de mercado maduro
                              # (Damodaran) + ~1,5% de prêmio small-cap/iliquidez. A Selic já
                              # precifica risco-país + inflação, então o ERP é só o prêmio de equity.
  selic_fallback: 0.105       # Selic de referência quando o BCB (selic_meta) está indisponível.
  rf_ciclo_anos: 10           # rf do CAPM = Selic MÉDIA destes últimos N anos (through-the-cycle).
                              # Numa perpetuidade (DDM) a taxa deve refletir o juro de LP, não o
                              # pico de ciclo: a Selic spot (~14%) inflaria o Ke e marcaria quase
                              # tudo como "sobreavaliada". A média 10a (~9,6%) é objetiva e
                              # auto-atualiza. O CORTE do DY (Cap. 8) segue usando a Selic SPOT.
  rf_local: 0.105             # rf do CAPM local: os entry points (cli/app) SOBRESCREVEM com a
                              # Selic through-the-cycle do BCB; default == selic_fallback p/ a
                              # engine rodar offline/determinística nos testes (sem chamar a rede).
  # --- abordagem "eua_ajustada" (legado/fallback de método, literais do livro fim de 2019) ---
  rf_us: 0.0192               # T-Bond EUA 10a (livro, fim de 2019)
  embi_brasil: 0.0214         # risco-país EMBI+ (livro)
  erp_us: 0.0620              # prêmio de risco histórico EUA (livro)
  inflacao_br: 0.0440         # expectativa de inflação BR 5a (livro)
  inflacao_us: 0.0252         # expectativa de inflação EUA 5a (livro)
  beta_meses: 60              # janela de retornos mensais para o beta
  indice_mercado: "^BVSP"

# --- Cap. 14/15/17: crescimento e DDM ---
ddm:
  n_anos_explicito: 10        # estágio de alto crescimento (livro: 5 a 10)
  g_estavel: 0.025            # crescimento na perpetuidade <= PIB (Focus/BCB ~2,5%)
  tributacao_dividendos: 0.0  # toggle: imposto sobre dividendos (ex.: 0.15)
  sensibilidade:
    delta_ke: [-0.02, -0.01, 0.0, 0.01, 0.02]
    delta_g: [-0.01, -0.005, 0.0, 0.005, 0.01]

# --- v1.2: indicadores técnicos (consultivos) — parâmetros canônicos ---
indicadores:
  sma_emas: [20, 50, 200]
  donchian: [20, 55]
  bollinger:
    janela: 20
    sigma: 2.0
  squeeze_janela: 126        # ~6 meses
  squeeze_percentil: 20
  adx_janela: 14             # Wilder
  rsi_janela: 14             # Wilder
  rsi_faixas: [30, 70]
  macd: [12, 26, 9]
  regressao_janela: 90       # ~1 trimestre
  pivo_n: 2                  # fractal de Williams: N barras fechadas de cada lado (swing diário, D-02; calibração empírica deferida)
  stop_atr_m: 1.5            # multiplicador do ATR no stop técnico (mais conservador entre swing e ATR×m — D-08; consumido na Fase 13 plano 04)
  cluster_k: 1.0             # largura da zona S/R = k×ATR — adapta à volatilidade do papel (D-10); Donchian 20/55 já entra como faixa externa
  volume_janela: 20          # janela da MM de volume p/ confirmar rompimentos (VOL-01)
  base_temporal: "diario"    # "diario" | "semanal" (resample W-FRI). AUD-IND-01: default DIÁRIO —
                             # os params acima (RSI14/MACD12-26-9/SMA200/squeeze126/regressão90) são
                             # calibrados p/ barra diária; rodá-los no frame semanal (W-FRI, ~260 barras
                             # em 5a) dava RSI em onda quadrada e histograma MACD reto. É o caminho que
                             # os goldens validam (tests forçam "diario").

# --- v1.4 Fase 14: padrões gráficos sobre pivôs (Murphy) — MVP duplo topo/fundo + OCO ---
# Limiares GEOMÉTRICOS do detector de padrões. Vivem aqui (config-driven) e não hardcoded:
# ajuste sem deploy e os goldens os pinam via _cfg_ind(). Valores iniciais são ASSUMED (A1–A7
# do 14-RESEARCH, confiança LOW-MEDIUM) — a calibração multi-ticker é o plano 14-05. Bloco NOVO,
# irmão de `indicadores:`; nenhuma linha de `indicadores:` é tocada (anti-rebaseline, Pitfall 5).
padroes:
  lookback_pivos: 8           # nº de pivôs confirmados mais recentes varridos (janela de busca);
                              # curto demais perde padrões longos, longo demais casa pivôs sem relação
  price_tolerance_pct: 0.03   # simetria de PREÇO entre os 2 topos/fundos do duplo (<=3%): frouxo vira
                              # pareidolia, rígido não detecta o padrão real
  shoulder_symmetry_pct: 0.05 # simetria dos 2 ombros da OCO (<=5%): a OCO é o padrão mais sensível à
                              # simetria, daí a folga maior que o duplo
  head_min_prominence_pct: 0.02  # a cabeça da OCO deve exceder CADA ombro em >=2% — anti-falso-OCO em
                                 # série lateral (três topos quase iguais não são OCO)
  min_pattern_height_pct: 0.03   # altura mínima (measured-move) como % da neckline (>=3%): filtro
                                 # anti-ruído p/ não casar micro-zigue-zagues sem alvo relevante
  exigir_volume_confirma: true   # confirmação exige rompimento da neckline COM volume>MM na barra
                                 # fechada; sem volume o padrão fica "em_formacao" (nunca "confirmado")

# --- v1.4 Fase 15: score de confluência técnica (SCORE-01) ---
# Bloco NOVO, irmão de `indicadores:`/`padroes:`. Nenhuma linha existente é tocada
# (anti-rebaseline, Pitfall 4 — os 271 goldens das Fases 12–14 não podem flutuar).
# Toda a montagem do setup (report/setup.py) lê DAQUI: zero hardcode de pesos/cortes (D-01).
# Valores numéricos são ASSUMED/calibráveis (15-RESEARCH A1–A5) — ajuste sem deploy; os
# goldens os pinam via _cfg_ind(). Os PESOS estão travados em CONTEXT D-01 (tendência domina).
score:
  pesos:                          # somam 100 (D-01: tendência domina forte — operar a favor de Murphy)
    tendencia: 35                 # contexto.dow_diario + forca.forca_adx + posicao_mm200 (família dominante)
    risco_retorno: 20             # razão retorno/risco recomputada dos níveis (também é GATE DURO abaixo)
    padroes: 20                   # padrão coerente com a direção do dow (confirmado/em_formacao)
    momentum: 15                  # MACD/RSI direção-aware (confirma a favor da tendência, Pitfall 5)
    volume: 10                    # rompimento_com_volume (confirmação) / volume_acima_mm (meio-termo)
  rr_minimo: 1.5                  # GATE DURO (D-03/D-04): rr < isto OU indisponível → "Sem setup". Calibrável.
  rr_alvo: 3.0                    # teto de normalização do sub-score de R:R (clamp em [rr_minimo, rr_alvo]) (A3)
  penalidade_conflito_mtf: 0.20   # alinhamento_mtf=="conflito" → score ×(1−0.20); penaliza, nunca bloqueia (D-07)
  cortes_grade:                   # sobre o score 0-100 (D-05). Calibráveis.
    forte: 70                     # score >= 70 → "Forte"
    moderado: 50                  # score >= 50 → "Moderado"
    fraco: 25                     # score >= 25 → "Fraco"; abaixo (com gate ok) → ainda "Sem setup" (floor, Open Q1)

# --- Fase 20: Selo de Sustentabilidade do Dividendo (SELO-01) ---
# Bloco NOVO, irmão de `screening:`/`score:`. A cor do selo é DERIVADA do score BSD (0-100)
# que a engine já calcula (screening.bsd_ranking) — nenhum score novo. Estes são os cortes
# de cor INICIAIS (D1) e o ÚNICO ponto de ajuste dos limiares (tunável sem deploy). A matriz
# de rótulos do quadrante (JOIA/VALUE TRAP/...) fica no código (copy estável, NÃO tunável).
selo:
  cor:                            # cortes do BSD → cor. verde >= 70 · azul 55-70 · amarelo 40-55 · vermelho < 40
    verde_min: 70                 # BSD >= 70 → verde (qualidade Alta)
    azul_min: 55                  # 55 <= BSD < 70 → azul (qualidade Alta)
    amarelo_min: 40               # 40 <= BSD < 55 → amarelo (qualidade Baixa); abaixo de 40 → vermelho

# --- Fase 1 (v2.2): Classificador de Arquétipo (ARQ-01/ARQ-02) ---
# Bloco NOVO, irmão de `selo:`. Thresholds INICIAIS do classificador de arquétipo
# (core/arquetipo.py). São config-driven: o classificador nunca hardcoda 0.15/0.40/0.50
# no corpo — lê tudo daqui via cfg["arquetipo"]. Valores são ponto de partida honesto;
# a calibração empírica (backtest sobre a B3) é BACKTEST-01, deferida. Ajuste sem deploy.
# Anti-rebaseline (Pitfall 4): nenhum bloco pré-existente é tocado.
arquetipo:
  financeiro_tokens:              # setor CVM contendo QUALQUER destes → hard-route financeira (RIM), soberano
    - banco
    - "intermediação financeira"
    - "intermediacao financeira"
    - seguradora
    - "arrendamento mercantil"
    - "crédito imobiliário"
    - "credito imobiliario"
    - factoring
    - securitização
    - securitizacao
    - "bolsas de valores"
  regulada_excluir_tokens:        # guarda anti-Petróleo: eh_concessionaria + setor com estes NÃO vira pagadora_regulada
    - petróleo
    - petroleo
  roe_alto_min: 0.15              # ROE de valuation >= isto (com retenção alta) → candidato compounder (crescimento)
  retencao_alta_min: 0.50         # (1 - payout) >= isto (com ROE alto) → candidato compounder (crescimento)
  ciclica_cv_min: 0.40            # coef. de variação do lucro cru >= isto → candidato cíclica (lucro oscilante)
